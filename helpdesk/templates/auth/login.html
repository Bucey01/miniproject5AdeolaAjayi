
{% extends 'base.html' %}

{% block title %}Log In{% endblock %}

{% block header %}
Log In to IT Help Desk
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-4">
                    User Login
                </h4>

                <form method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>
                        <input type="text"
                               class="form-control"
                               name="username"
                               id="username"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>
                        <input type="password"
                               class="form-control"
                               name="password"
                               id="password"
                               required>
                    </div>

                    <button type="submit"
                            class="btn btn-primary">
                        Log In
                    </button>
                </form>

                <p class="mt-3">
                    Don't have an account?
                    <a href="{{ url_for('auth.register') }}">
                        Register Here
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
